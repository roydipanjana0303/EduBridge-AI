server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: edubridge-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/edubridge}
    username: ${DATABASE_USERNAME:edubridge}
    password: ${DATABASE_PASSWORD:edubridge_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt:
    secret: ${APP_JWT_SECRET:change-this-local-development-secret-32-chars-minimum}
    ttl-seconds: ${APP_JWT_TTL_SECONDS:3600}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
livekit:
  url: ${LIVEKIT_URL:}
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}
